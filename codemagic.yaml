app:
  projectPath: mobile
  platform: android

workflows:
  dotvex-android:
    name: DOTVEX Android
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: |
          npm install
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo prebuild --platform android --no-install
      - name: Configure Firebase
        working_directory: mobile/android
        script: |
          # Add Google Services plugin and classpath for Firebase
          sed -i '' '/apply plugin: "com.facebook.react"/a\
          apply plugin: "com.google.gms.google-services"' app/build.gradle
          sed -i '' '/classpath.*kotlin-gradle-plugin/a\
              classpath("com.google.gms:google-services:4.4.2")' build.gradle
          cp ../google-services.json app/google-services.json 2>/dev/null || true
          echo "Firebase Google Services configured"
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
