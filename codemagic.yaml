fileVersion: 1
workflows:
  dotvex-android:
    name: DOTVEX Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle
        - mobile/node_modules
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: |
          npm install
          npm uninstall @react-native-community/slider --save 2>/dev/null || true
          rm -rf node_modules/@react-native-community/slider 2>/dev/null || true
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo prebuild --platform android --no-install
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
