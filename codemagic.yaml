app:
  projectPath: mobile
  platform: android

workflows:
  dotvex-android:
    name: DOTVEX Android
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install Dependencies
        working_directory: mobile
        script: |
          npm install
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo@latest prebuild --platform android
      - name: Configure Firebase
        working_directory: mobile/android
        script: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const appBuildGradle = path.join(__dirname, 'app', 'build.gradle');
            let appGradle = fs.readFileSync(appBuildGradle, 'utf8');
            if (!appGradle.includes('com.google.gms.google-services')) {
              appGradle = appGradle.replace('apply plugin: \"com.facebook.react\"', 'apply plugin: \"com.facebook.react\"\napply plugin: \"com.google.gms.google-services\"');
              fs.writeFileSync(appBuildGradle, appGradle);
              console.log('Added Google Services plugin');
            }
            const rootBuildGradle = path.join(__dirname, 'build.gradle');
            let rootGradle = fs.readFileSync(rootBuildGradle, 'utf8');
            if (!rootGradle.includes('com.google.gms:google-services')) {
              rootGradle = rootGradle.replace('classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin\")', 'classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin\")\n    classpath(\"com.google.gms:google-services:4.4.2\")');
              fs.writeFileSync(rootBuildGradle, rootGradle);
              console.log('Added Google Services classpath');
            }
            console.log('Firebase configured');
          "
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
