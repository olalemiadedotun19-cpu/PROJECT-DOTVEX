workflows:
  dotvex-android:
    name: DOTVEX Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle
        - ~/Library/Caches/CocoaPods
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: mobile-app
          include: true
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: |
          npm install
      - name: Install Expo CLI
        script: |
          npm install -g expo-cli
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo prebuild --platform android
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
