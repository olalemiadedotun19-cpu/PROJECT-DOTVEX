app:
  projectPath: mobile
  platform: android

workflows:
  dotvex-android:
    name: DOTVEX Android
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: |
          npm install
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo prebuild --platform android --no-install
      - name: Configure Firebase and Android build
        working_directory: mobile/android
        script: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            // Configure app/build.gradle
            const appBuildGradle = path.join(__dirname, 'app', 'build.gradle');
            let appGradle = fs.readFileSync(appBuildGradle, 'utf8');

            // Add Google Services plugin after com.facebook.react if not present
            if (!appGradle.includes('com.google.gms.google-services')) {
              appGradle = appGradle.replace(
                'apply plugin: "com.facebook.react"',
                'apply plugin: "com.facebook.react"\napply plugin: "com.google.gms.google-services"'
              );
              fs.writeFileSync(appBuildGradle, appGradle);
              console.log('Added Google Services plugin to app/build.gradle');
            }

            // Add multiDexEnabled for large apps
            if (!appGradle.includes('multiDexEnabled')) {
              appGradle = appGradle.replace(
                'defaultConfig {',
                'defaultConfig {\n        multiDexEnabled true'
              );
              fs.writeFileSync(appBuildGradle, appGradle);
              console.log('Added multiDexEnabled to app/build.gradle');
            }

            // Configure root build.gradle
            const rootBuildGradle = path.join(__dirname, 'build.gradle');
            let rootGradle = fs.readFileSync(rootBuildGradle, 'utf8');

            // Add Google Services classpath if not present
            if (!rootGradle.includes('com.google.gms:google-services')) {
              rootGradle = rootGradle.replace(
                'classpath(\'org.jetbrains.kotlin:kotlin-gradle-plugin\')',
                'classpath(\'org.jetbrains.kotlin:kotlin-gradle-plugin\')\n    classpath(\'com.google.gms:google-services:4.4.2\')'
              );
              fs.writeFileSync(rootBuildGradle, rootGradle);
              console.log('Added Google Services classpath to build.gradle');
            }

            // Copy google-services.json to android/app
            const srcGoogleServices = path.join(__dirname, '..', 'google-services.json');
            const destGoogleServices = path.join(__dirname, 'app', 'google-services.json');
            if (fs.existsSync(srcGoogleServices)) {
              fs.copyFileSync(srcGoogleServices, destGoogleServices);
              console.log('Copied google-services.json to android/app/');
            }

            console.log('Firebase and Android build configuration complete');
          "
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
