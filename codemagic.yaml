app:
  projectPath: mobile
  platform: android

workflows:
  dotvex-android:
    name: DOTVEX Android
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: |
          npm install
      - name: Prebuild Android
        working_directory: mobile
        script: |
          npx expo prebuild --platform android --no-install
      - name: Build Android APK
        working_directory: mobile/android
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - olalemiadedotun19@gmail.com
